<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Gauri's Kitchen</title>
    
    <!-- Link to your custom stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts for "Methi & More" (Great Vibes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    
    <!-- Google Fonts for "Shuddha Satvik & Paushtik" (Caveat) -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- IMPORTANT: If 'Great Vibes' and 'Caveat' don't exactly match your original yellow banner image,
         you might want to try other similar Google Fonts like:
         - For 'Methi & More': 'Dancing Script', 'Sacramento', 'Parisienne'
         - For 'Shuddha Satvik & Paushtik': 'Indie Flower', 'Handlee', 'Kalam'
         You would replace the font family name in the <link href...> and in style.css accordingly. -->

</head>
<body>

    <!-- Top navigation/header section -->
    <header>
        <h2>From Gauri's Kitchen</h2>
        <div class="menu-icon">☰</div>
    </header>

    <!-- Hero banner section -->
    <div class="hero">
        <!-- Decorative flower images - ensure these are in an 'images' folder in your repository -->
        <img src="images/flower1.png" alt="Decorative flower" class="flower flower-top-right">
        <img src="images/flower2.png" alt="Decorative flower" class="flower flower-bottom-left">

        <!-- Logo -->
        <img src="logo.png" alt="Gauri's Kitchen Logo" class="logo">
        
        <!-- Main title -->
        <h1 class="main-title">Methi & More</h1>
        
        <!-- Tagline -->
        <p class="tagline">Shuddha Satvik & Paushtik</p>
        
        <!-- Call to action button -->
        <a href="#products" class="button">Explore Our Products</a>
    </div>

    <!-- Example Products Section -->
    <section id="products">
        <h2>Our Products</h2>
        <p>Select a quantity and add items to your cart.</p>
        <!-- Your actual product cards/listings would go here -->
        <div class="product-grid">
            <!-- Example Product Card (you'll duplicate and fill this in) -->
            <div class="product-card">
                <img src="images/product-ladoo-example.png" alt="Product Image" class="product-image">
                <h3>Product Name</h3>
                <p class="price">$XX.XX</p>
                <button class="add-to-cart-button">Add to Cart</button>
            </div>
            <!-- More product cards -->
        </div>
    </section>

    <!-- Footer section -->
    <footer>
        <p>&copy; <span id="current-year"></span> Gauri's Kitchen. All rights reserved.</p>
    </footer>

    <!-- JavaScript to automatically update the copyright year -->
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
